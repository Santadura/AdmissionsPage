<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Test DB</title>
</head>
<body>
    <h2>So luong thi sinh: <span th:text="${count}"></span></h2>

    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>CCCD</th>
                <th>Ho ten</th>
                <th>Ngay sinh</th>
                <th>Email</th>
                <th>Dien thoai</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ts : ${thiSinhs}">
                <td th:text="${ts.id}"></td>
                <td th:text="${ts.cccd}"></td>
                <td th:text="${ts.hoTen}"></td>
                <td th:text="${ts.ngaySinh}"></td>
                <td th:text="${ts.email}"></td>
                <td th:text="${ts.dienThoai}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
