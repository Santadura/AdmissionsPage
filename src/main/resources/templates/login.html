<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập thí sinh</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 420px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #0d47a1;
        }

        p.note {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            margin-top: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            background: #1976d2;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1259a7;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Đăng nhập thí sinh</h2>
    <p class="note">Username là CCCD, mật khẩu là ngày sinh dạng ddMMyyyy.</p>

    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form method="post" th:action="@{/login}">
        <label for="cccd">CCCD</label>
        <input type="text" id="cccd" name="cccd" th:value="${cccd}" placeholder="Nhập số CCCD">

        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" placeholder="Nhập mật khẩu">

        <button type="submit">Đăng nhập</button>
    </form>
</div>
</body>
</html>
